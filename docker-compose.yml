version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tubestaniku:sec-0.2
    container_name: taniku_app
    user: "1001:1001"
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    expose:
      - "3000"
    networks:
      - taniku_net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: taniku_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tubestaniku}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - taniku_net
    restart: unless-stopped

networks:
  taniku_net:
    driver: bridge

volumes:
  pgdata:
